components:
  schemas:
    AdminCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        parent_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        display_order:
          type: integer
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - display_order
      - id
      - is_active
      - name
      - parent_id
      - slug
    AdminCategoryWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        parent:
          type: string
          nullable: true
          pattern: ^[-a-zA-Z0-9_]+$
        display_order:
          type: integer
          minimum: 0
          default: 0
      required:
      - name
    AdminProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
        store_id:
          type: string
          format: uuid
          readOnly: true
        university_id:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        listed_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - expires_at
      - id
      - listed_at
      - name
      - price
      - slug
      - status
      - store_id
      - university_id
    AdminResolution:
      type: object
      properties:
        resolution_notes:
          type: string
          nullable: true
    AdminUser:
      type: object
      description: |-
        Read-only. is_active is presented here but is never writable
        through this serializer — the activate/deactivate actions are
        dedicated endpoints backed by UserService, not a PATCH field.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone_number:
          type: string
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
        active_university:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            short_name:
              type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active_university
      - created_at
      - date_joined
      - email
      - full_name
      - id
      - is_active
      - is_staff
      - phone_number
    AdminVendor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: string
          format: uuid
          readOnly: true
        store_name:
          type: string
          readOnly: true
        vendor_type:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
        university_id:
          type: string
          format: uuid
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - id
      - reviewed_at
      - status
      - store_name
      - submitted_at
      - university_id
      - user_id
      - vendor_type
    AvailabilityEnum:
      type: string
      enum:
      - IN_STOCK
      - OUT_OF_STOCK
    Category:
      type: object
      description: Read-only representation used for every response body.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        parent:
          type: string
          readOnly: true
        display_order:
          type: integer
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - display_order
      - id
      - is_active
      - name
      - parent
      - slug
      - updated_at
    CategoryBrief:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - name
      - slug
    CategoryCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        parent:
          type: string
          nullable: true
        display_order:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - name
    CategoryUpdate:
      type: object
      description: Only `name` is writable post-creation.
      properties:
        name:
          type: string
          maxLength: 100
      required:
      - name
    ConditionEnum:
      enum:
      - NEW
      - USED
      type: string
      description: |-
        * `NEW` - New
        * `USED` - Used
    Conversation:
      type: object
      description: Read-only. Used for list/retrieve/create-echo/complete-echo.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer:
          type: string
          format: uuid
          readOnly: true
        vendor:
          type: string
          format: uuid
          readOnly: true
        vendor_store_name:
          type: string
          readOnly: true
        product:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        product_name:
          type: string
          readOnly: true
        transaction_status:
          allOf:
          - $ref: '#/components/schemas/TransactionStatusEnum'
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        unread_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - completed_at
      - created_at
      - customer
      - id
      - product
      - product_name
      - transaction_status
      - unread_count
      - updated_at
      - vendor
      - vendor_store_name
    DashboardSummary:
      type: object
      properties:
        users:
          type: object
          additionalProperties: {}
        vendors:
          type: object
          additionalProperties: {}
        products:
          type: object
          additionalProperties: {}
        categories:
          type: object
          additionalProperties: {}
        reports:
          type: object
          additionalProperties: {}
      required:
      - categories
      - products
      - reports
      - users
      - vendors
    DeviceToken:
      type: object
      description: Read-only — every DeviceToken response body.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        token:
          type: string
          readOnly: true
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
        platform_display:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - last_used_at
      - platform
      - platform_display
      - token
    DeviceTokenListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/DeviceToken'
      required:
      - data
      - message
      - success
    DeviceTokenRegister:
      type: object
      properties:
        token:
          type: string
          maxLength: 255
        platform:
          $ref: '#/components/schemas/PlatformEnum'
      required:
      - platform
      - token
    DeviceTokenResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/DeviceToken'
      required:
      - data
      - message
      - success
    DocumentTypeEnum:
      enum:
      - ADMISSION_LETTER
      - STUDENT_ID_CARD
      - COURSE_REGISTRATION_SLIP
      - SCHOOL_FEE_RECEIPT
      - BUSINESS_DOCUMENT
      type: string
      description: |-
        * `ADMISSION_LETTER` - Admission Letter
        * `STUDENT_ID_CARD` - Student ID Card
        * `COURSE_REGISTRATION_SLIP` - Course Registration Slip
        * `SCHOOL_FEE_RECEIPT` - School Fee Receipt
        * `BUSINESS_DOCUMENT` - Business Document
    EmailTokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    MarkAllReadData:
      type: object
      properties:
        marked_read:
          type: integer
      required:
      - marked_read
    MarkAllReadResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/MarkAllReadData'
      required:
      - data
      - message
      - success
    Notification:
